[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "smart-ai-models-routers"
version = "0.4.0"
description = "HIF: provider-agnostic task orchestration for AI assistants"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - license to be selected" }
dependencies = [
  "pydantic>=2.8",
  "typer>=0.12",
  "rich>=13.7",
  "mcp>=1.27.2,<2",
  "uvicorn>=0.30",
  "PyJWT[crypto]>=2.8",
  "psutil>=6.0",
  "python-dotenv>=1.0"
]

[project.optional-dependencies]
providers = ["litellm>=1.109.0"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
hif = "hif.cli:app"
hif-mcp = "hif.mcp_server:main"
hif-gateway = "hif.gateway:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hif"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
